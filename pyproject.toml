[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vramfit"
version = "1.0.0"
description = "Will this model actually fit on this GPU? Explainable VRAM, KV-cache and tok/s planning for local LLM inference. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "mehulpatel23b-pixel" }]
keywords = [
    "llm",
    "vram",
    "gpu",
    "inference",
    "quantization",
    "gguf",
    "llama.cpp",
    "local-llm",
    "kv-cache",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
vramfit = "vramfit.cli:main"

[project.urls]
Homepage = "https://github.com/mehulpatel23b-pixel/vramfit"
Issues = "https://github.com/mehulpatel23b-pixel/vramfit/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
